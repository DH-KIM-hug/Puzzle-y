<!-- PROTOTYPE - NOT FOR PRODUCTION
Question: Do players plan placements with a preview to trigger multi-step chains (cluster -> action -> track threshold -> bonus -> other track), and does the chain moment on a growing sprite-stacked island make them replay? Riskiest assumption: the chain feels like a payoff, not bookkeeping.
Date: 2026-11-21
-->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작은 섬 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3b2615; --ink2:#6a4a2c; --paper:#f6ead2; --paper2:#efdcb8; --rim:#6a4024; --rimDark:#4a2c17;

  --c0:#e3b23c; --c1:#4e8a3e; --c2:#9fcb5e; --c3:#5fb0dc; --c4:#c8643f;
  --fontH:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif;
  --fontB:'Gowun Dodum','Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:var(--fontB);
  background-color:#7a4b2a;
  background-image:

    radial-gradient(ellipse at 50% 120%, rgba(0,0,0,.35), rgba(0,0,0,0) 60%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 2px, rgba(0,0,0,0) 2px 170px),
    repeating-linear-gradient(90deg, #7d4d2b 0 60px, #7a4a29 60px 61px, #81512e 61px 115px, #784828 115px 170px);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:var(--fontH);cursor:pointer}
#app{display:grid;height:100vh;height:100dvh;width:100vw;padding:8px;gap:8px;
  grid-template-columns:minmax(200px,250px) 1fr minmax(210px,270px);

.panel{background:var(--paper);border:3px solid var(--rim);border-radius:14px;

#top{grid-area:top;display:flex;align-items:center;gap:8px;padding:6px 10px;flex-wrap:wrap}

.pill{font-family:var(--fontH);background:var(--paper2);border:2px solid var(--rim);border-radius:999px;padding:2px 10px;font-size:15px;white-space:nowrap}

.spacer{flex:1}
.btn{background:#fbe7bd;border:2px solid var(--rim);border-radius:10px;padding:4px 10px;font-size:15px;color:var(--ink);

@keyframes pulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,200,60,.9)}40%{transform:scale(1.05);box-shadow:0 0 0 6px rgba(255,200,60,.5)}100%{transform:scale(1);box-shadow:0 0 0 10px rgba(255,200,60,0)}}

#ring{font-size:12px;color:var(--ink2);text-align:center;margin-top:2px}
#stage{grid-area:stage;position:relative;min-height:0;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#banners{position:absolute;left:50%;top:6px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:96%}
.banner{font-family:var(--fontH);background:#fff4cf;border:3px solid var(--rim);border-radius:14px;padding:3px 14px;
  box-shadow:0 3px 0 var(--rimDark),0 8px 16px rgba(0,0,0,.3);animation:bIn .45s cubic-bezier(.2,1.6,.4,1) both, bOut .5s ease-in 2.1s forwards;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.banner .dp{display:inline-block;background:var(--rim);color:#fff3d6;border-radius:8px;padding:0 6px;margin-right:6px;font-size:.7em;vertical-align:middle}
@keyframes bIn{0%{transform:scale(.2) translateY(-20px);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bOut{to{opacity:0;transform:translateY(-10px) scale(.95)}}
#camBtns{position:absolute;right:6px;bottom:6px;display:flex;gap:6px}
#camBtns .btn{font-family:'DejaVu Sans',Arial,sans-serif;font-size:18px;padding:4px 10px}

#chainBadge.d0{background:#a89a84}#chainBadge.d1{background:#d08a2a}#chainBadge.d2{background:#d9632a}#chainBadge.d3{background:#c23b5a;animation:wob 1s infinite}
@keyframes wob{50%{transform:scale(1.12) rotate(-3deg)}}

#steps li.bonus{border-color:#e8b04a;background:#fff2cc}
#steps li .tag{font-family:var(--fontH);font-size:12px;border-radius:6px;padding:0 5px;color:#fff;margin-right:4px}
#steps li.feed{border-color:#c98c6a;background:#ffe9dc}
#steps li.bad{border-color:var(--bad);background:#ffe1d8}

#hand{grid-area:hand;display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:2px 0 4px}
.card{background:var(--paper);border:3px solid var(--rim);border-radius:12px;padding:3px 3px 2px;display:flex;flex-direction:column;align-items:center;
  box-shadow:0 4px 0 var(--rimDark),0 8px 14px rgba(0,0,0,.3);touch-action:none;cursor:grab;transition:transform .12s}
.card canvas{width:120px;height:80px;display:block}
.card .lb{font-family:var(--fontH);font-size:13px;display:flex;gap:4px;align-items:center}
.card.sel{border-color:var(--gold);transform:translateY(-8px);box-shadow:0 0 0 3px #ffd56a,0 10px 0 var(--rimDark),0 14px 18px rgba(0,0,0,.35)}
.card.drag{opacity:.55}

#overlay.show{display:flex}

#resultBox h2{font-family:var(--fontH);font-weight:400;font-size:28px;margin:0 0 6px}

#feed.show{display:block;animation:bIn .4s cubic-bezier(.2,1.6,.4,1) both}
#feed h3{font-family:var(--fontH);font-weight:400;font-size:24px;margin:0 0 4px}
#feed .ln{font-size:16px;margin:2px 0}
#feed .pen{font-family:var(--fontH);font-size:22px;color:var(--bad)}
#feed .ok{font-family:var(--fontH);font-size:20px;color:var(--good)}

/* phone landscape / short screens */
@media (max-height:520px) and (min-aspect-ratio:1/1){
  #app{padding:4px;gap:4px;grid-template-columns:170px 1fr 190px}
  #top{padding:2px 6px;gap:5px} #top h1{font-size:16px} .pill,.btn{font-size:12px;padding:2px 6px}
  .trk{padding:2px 5px} .trk .val{font-size:16px} .trk .nm{font-size:13px} .trk .bn{font-size:10px} .seg{height:6px}
  #tracks h2,#side h2{font-size:14px}
  .card canvas{width:84px;height:54px} .card .lb{font-size:11px} #rotBtn{width:42px;height:42px;font-size:20px;margin-bottom:6px}
  #steps li{font-size:11px;padding:1px 4px}
  #hint{display:none}
}
/* portrait: tracks above, hand below */
@media (max-aspect-ratio:1/1){
  #app{padding:5px;gap:5px;grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto auto;
    grid-template-areas:"top" "tracks" "stage" "side" "hand"}
  #top{padding:3px 6px;gap:4px} #top h1{font-size:16px;width:auto} .pill{font-size:12px;padding:1px 7px} .btn{font-size:12px;padding:2px 7px}
  #tracks{flex-direction:row;padding:5px;gap:4px;overflow:visible}
  #tracks h2,#ring{display:none}
  .trk{flex:1;min-width:0;padding:3px 4px}
  .trk .row1{flex-wrap:wrap;gap:2px} .trk .nm{font-size:12px;gap:3px} .dot{width:9px;height:9px}
  .trk .val{font-size:17px;margin-left:0;width:100%} .trk .dl{font-size:12px;position:absolute;right:4px;top:18px}
  .trk .stars{display:none}
  .trk .bn{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .trk .bn .long{display:none}
  .bar{gap:2px} .seg{height:6px}
  #side{max-height:96px;padding:4px 6px;gap:3px} #side h2{font-size:14px} #steps li{font-size:11px;padding:1px 4px} #sideFoot{display:none}
  .card canvas{width:92px;height:60px} .card .lb{font-size:11px} #hand{gap:6px}
  #rotBtn{width:46px;height:46px;font-size:22px;margin-bottom:8px}
  #hint{display:none}
  .banner{font-size:15px !important}
}
</style>
</head>
<body>
<div id="app">
  <header id="top" class="panel">
    <h1>작은 섬</h1>
    <span class="pill" id="season">봄 · 1/6</span>
    <span class="pill" id="score">점수 <b>0</b></span>
    <span class="pill" id="seedLbl">섬 #42</span>
    <span class="spacer"></span>
    <button class="btn" id="balBtn" title="점수 = 가장 낮은 트랙 × 5">균형 섬: 끔</button>
    <button class="btn" id="againBtn">다시</button>
    <button class="btn" id="newBtn">새 섬</button>
  </header>
  <aside id="tracks" class="panel"><h2>자원 트랙</h2><div id="trkList" style="display:contents"></div><div id="ring">5마다 보너스 · 고리처럼 이어짐<br>곡식→주민→목재→양모→물고기→곡식</div></aside>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="banners"></div>
    <div id="feed" class="panel"></div>
    <div id="hint">끌어서 놓기 · R/휠/우클릭: 조각 회전 · Q/E·우클릭 드래그: 카메라</div>
    <div id="camBtns"><button class="btn" id="camL" title="카메라 왼쪽 (Q)">⟲</button><button class="btn" id="camR" title="카메라 오른쪽 (E)">⟳</button></div>
  </main>
  <aside id="side" class="panel">
    <h2>미리보기 <span id="chainBadge" class="d0">연쇄 0</span></h2>
    <ul id="steps"></ul>
    <div id="sideFoot"></div>
  </aside>
  <footer id="hand"></footer>
</div>
<div id="overlay"><div id="resultBox" class="panel"></div></div>
<script>
'use strict';
// ================= RULES / LOGIC (pure) =================
const SQ3=Math.sqrt(3), TAU=Math.PI*2, PITCH=0.55, R=4, SLAB=5, CAP=8, PER_SEASON=6, NSEASON=4;
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const T=[{n:'밭',res:'곡식',c:'#e3b23c'},{n:'숲',res:'목재',c:'#4e8a3e'},{n:'목장',res:'양모',c:'#9fcb5e'},{n:'물',res:'물고기',c:'#5fb0dc'},{n:'집',res:'주민',c:'#c8643f'}];
const BONUS={0:{to:4,amt:2,name:'풍년'},4:{to:1,amt:3,name:'일손'},1:{to:2,amt:2,name:'울타리'},2:{to:3,amt:3,name:'교역'},3:{to:0,amt:2,name:'거름'}};
const RING=[0,4,1,2,3];
const SEASONS=['봄','여름','가을','겨울'];
const key=(q,r)=>q+','+r;
const hexDist=(q,r)=>Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r));
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function ringHexes(n){const o=[];let q=DIRS[4][0]*n,r=DIRS[4][1]*n;for(let i=0;i<6;i++)for(let j=0;j<n;j++){o.push([q,r]);q+=DIRS[i][0];r+=DIRS[i][1];}return o;}
function genIsland(seed){
  const rand=rng(seed*9973+17), cells={};
  for(let q=-R;q<=R;q++)for(let r=-R;r<=R;r++)if(hexDist(q,r)<=R)cells[key(q,r)]={q,r,t:'land',tile:null};
  const ring=ringHexes(R);let n=0,g=0;
  while(n<8&&g++<200){const s=Math.floor(rand()*24),len=2+Math.floor(rand()*2);for(let k=0;k<len&&n<8;k++){const[q,r]=ring[(s+k)%24];const c=cells[key(q,r)];if(c.t==='land'){c.t='sea';n++;}}}
  const cand=Object.values(cells).filter(c=>{const d=hexDist(c.q,c.r);return d>=1&&d<=3;});
  let m=0;g=0;
  while(m<3&&g++<500){const c=cand[Math.floor(rand()*cand.length)];if(c.t!=='land')continue;
    if(DIRS.some(([dq,dr])=>{const nb=cells[key(c.q+dq,c.r+dr)];return nb&&nb.t==='mtn';}))continue;c.t='mtn';m++;}
  const bag=[];for(let a=0;a<5;a++)for(let b=a;b<5;b++)for(let k=0;k<2;k++)bag.push(rand()<0.5?[a,b]:[b,a]);
  for(let i=bag.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}
  return{cells,bag};
}
function newState(seed,balanced){
  const{cells,bag}=genIsland(seed);
  return{seed,cells,tracks:[0,0,0,0,0],penalty:0,placed:0,season:0,hand:bag.slice(0,3).map(p=>p.slice()),bag,bagPos:3,
    over:false,balanced:!!balanced,log:[],feeds:[],passes:0,maxDepth:0,bonusTotal:0};
}
function emptyLand(st,q,r){const c=st.cells[key(q,r)];return!!c&&c.t==='land'&&c.tile===null;}
function bfs(st,start,type,overlay){
  const get=k=>(overlay&&k in overlay)?overlay[k]:(st.cells[k]?st.cells[k].tile:null);
  if(get(start)!==type)return[];
  const seen=new Set([start]),out=[start],stack=[start];
  while(stack.length){const k=stack.pop();const c=st.cells[k];
    for(const[dq,dr]of DIRS){const nk=key(c.q+dq,c.r+dr);if(!seen.has(nk)&&st.cells[nk]&&get(nk)===type){seen.add(nk);out.push(nk);stack.push(nk);}}}
  return out;
}
function feedCalc(tracks,season){const people=tracks[4],need=Math.ceil(people/2),had=tracks[0],shortfall=Math.max(0,need-had);
  return{season,people,need,had,shortfall,penalty:shortfall*2,grainAfter:Math.max(0,had-need)};}
function scoreOf(tracks,penalty,balanced){return(balanced?Math.min(...tracks)*5:tracks.reduce((a,b)=>a+b,0))-penalty;}
/** Pure: exact outcome of placing hand[handIdx] at (q,r) with rotation rot. Used by BOTH preview and real placement. */
function simulate(st,handIdx,q,r,rot){
  rot=((rot%6)+6)%6;
  const piece=st.hand[handIdx];
  if(st.over)return{valid:false,reason:'게임 끝'};
  if(!piece)return{valid:false,reason:'조각 없음'};
  const q2=q+DIRS[rot][0],r2=r+DIRS[rot][1];
  if(!emptyLand(st,q,r)||!emptyLand(st,q2,r2))return{valid:false,reason:'빈 땅 두 칸이 필요해요',q,r,q2,r2,rot,handIdx};
  const[a,b]=piece,k1=key(q,r),k2=key(q2,r2),ov={[k1]:a,[k2]:b};
  const halves=[[q,r,a,k1],[q2,r2,b,k2]].map(([hq,hr,ty,k])=>{const cl=bfs(st,k,ty,ov);return{q:hq,r:hr,key:k,type:ty,n:cl.length,cluster:cl};});
  const tracks=st.tracks.slice(),tracksBefore=st.tracks.slice(),steps=[],queue=[];let maxDepth=0,capped=0,bonusCount=0;
  const add=(track,amt,depth,step)=>{const before=tracks[track],after=before+amt;tracks[track]=after;step.before=before;step.after=after;steps.push(step);
    const cr=Math.floor(after/5)-Math.floor(before/5);
    for(let c=0;c<cr;c++){const th=(Math.floor(before/5)+c+1)*5;if(depth+1<=CAP)queue.push({from:track,depth:depth+1,threshold:th});else capped++;}};
  halves.forEach((h,i)=>add(h.type,h.n,0,{kind:'action',half:i,type:h.type,track:h.type,amount:h.n,depth:0}));
  while(queue.length){const bq=queue.shift(),bo=BONUS[bq.from];maxDepth=Math.max(maxDepth,bq.depth);bonusCount++;
    add(bo.to,bo.amt,bq.depth,{kind:'bonus',from:bq.from,threshold:bq.threshold,track:bo.to,amount:bo.amt,depth:bq.depth,name:bo.name});}
  const placedAfter=st.placed+1;let seasonEnd=null,penaltyAfter=st.penalty;
  if(placedAfter%PER_SEASON===0){seasonEnd=feedCalc(tracks,st.season);tracks[0]=seasonEnd.grainAfter;penaltyAfter+=seasonEnd.penalty;}
  const over=placedAfter>=PER_SEASON*NSEASON;
  return{valid:true,handIdx,piece:[a,b],q,r,q2,r2,rot,halves,steps,depth:maxDepth,bonusCount,capped,tracksBefore,tracksAfter:tracks,
    seasonEnd,penaltyAfter,placedAfter,over,scoreBefore:scoreOf(tracksBefore,st.penalty,st.balanced),scoreAfter:scoreOf(tracks,penaltyAfter,st.balanced)};
}
function anyAdjacentEmpty(st){for(const k in st.cells){const c=st.cells[k];if(c.t!=='land'||c.tile!==null)continue;for(const[dq,dr]of DIRS)if(emptyLand(st,c.q+dq,c.r+dr))return true;}return false;}
function validMoves(st){const out=[];if(st.over)return out;
  for(let h=0;h<st.hand.length;h++)for(const k in st.cells){const c=st.cells[k];if(c.t!=='land'||c.tile!==null)continue;
    for(let rot=0;rot<6;rot++)if(emptyLand(st,c.q+DIRS[rot][0],c.r+DIRS[rot][1]))out.push([h,c.q,c.r,rot]);}
  return out;}
/** Mutates st with a simulate() result. Returns extra events (auto-passes). */
function commit(st,sim){
  st.cells[sim.halves[0].key].tile=sim.halves[0].type;st.cells[sim.halves[1].key].tile=sim.halves[1].type;
  st.tracks=sim.tracksAfter.slice();st.penalty=sim.penaltyAfter;st.placed=sim.placedAfter;
  st.maxDepth=Math.max(st.maxDepth,sim.depth);st.bonusTotal+=sim.bonusCount;
  if(st.bagPos<st.bag.length)st.hand[sim.handIdx]=st.bag[st.bagPos++].slice();else st.hand.splice(sim.handIdx,1);
  st.log.push({q:sim.q,r:sim.r,rot:sim.rot,piece:sim.piece,depth:sim.depth,score:sim.scoreAfter});
  if(sim.seasonEnd){st.feeds.push(sim.seasonEnd);st.season++;}
  st.over=sim.over;
  const passes=[];
  while(!st.over&&!(st.hand.length&&anyAdjacentEmpty(st))){
    st.placed++;st.passes++;const ev={pass:true,feed:null};
    if(st.placed%PER_SEASON===0){const f=feedCalc(st.tracks,st.season);st.tracks[0]=f.grainAfter;st.penalty+=f.penalty;st.feeds.push(f);st.season++;ev.feed=f;}
    if(st.placed>=PER_SEASON*NSEASON)st.over=true;passes.push(ev);}
  return passes;
}
function levelOf(n){return n>=6?3:n>=4?2:n>=2?1:0;}

function proj(x,y,z){const rx=x*V.cs-y*V.sn,ry=x*V.sn+y*V.cs;PX=V.cx+rx*V.S;PY=V.cy+ry*V.S*PITCH-z*V.sh;}
function depthOf(x,y){return x*V.sn+y*V.cs;}
function setupView(v,yaw){v.cs=Math.cos(yaw);v.sn=Math.sin(yaw);v.corner=[];
  for(let i=0;i<6;i++){const a=(30+60*i)*Math.PI/180,wx=Math.cos(a),wy=Math.sin(a);v.corner.push([(wx*v.cs-wy*v.sn)*v.S,(wx*v.sn+wy*v.cs)*v.S*PITCH]);}}
function wpos(q,r){return[SQ3*(q+r/2),1.5*r];}
function hexPath(x,y,z,k){const c=V.ctx;proj(x,y,z);const bx=PX,by=PY;c.beginPath();
  for(let i=0;i<6;i++){const o=V.corner[i];const X=bx+o[0]*k,Y=by+o[1]*k;i?c.lineTo(X,Y):c.moveTo(X,Y);}c.closePath();}
function ell(x,y,z,r,col){proj(x,y,z);const c=V.ctx;c.fillStyle=col;c.beginPath();c.ellipse(PX,PY,Math.max(.3,r*V.S),Math.max(.2,r*V.S*PITCH),0,0,TAU);c.fill();}
function poly(x,y,z,pts,col){const c=V.ctx;c.beginPath();for(let i=0;i<pts.length;i++){proj(x+pts[i][0],y+pts[i][1],z);i?c.lineTo(PX,PY):c.moveTo(PX,PY);}c.closePath();c.fillStyle=col;c.fill();}
const _sc={};
function rgbOf(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function shades(hex,n,lo,hi){lo=lo??0.7;hi=hi??1.08;const k=hex+n+'_'+lo+'_'+hi;if(_sc[k])return _sc[k];const[r,g,b]=rgbOf(hex),a=[];
  for(let i=0;i<n;i++){const f=n<2?hi:lo+(hi-lo)*i/(n-1);a.push(`rgb(${Math.min(255,r*f|0)},${Math.min(255,g*f|0)},${Math.min(255,b*f|0)})`);}return _sc[k]=a;}
function hash(q,r,s){let h=(q*374761393+r*668265263+(s||0)*2147483647)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296;}
const easeBack=u=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2);};
/** squash & stretch factors [heightScale, widthScale] */
function popF(vv,now){
  if(!vv)return[1,1];
  let h=1,w=1;const u=(now-vv.born)/560;
  if(u<0)return[0,0];
  if(u<1){h=Math.max(0,easeBack(u))*(1+0.28*Math.sin(u*Math.PI*2.5)*(1-u));w=Math.min(1,u*4)*(1-0.18*Math.sin(u*Math.PI*2.5)*(1-u));}
  const g=(now-(vv.grownAt||-1e9))/480;
  if(g>=0&&g<1){h*=1+0.32*Math.sin(g*Math.PI*2)*(1-g);w*=1-0.14*Math.sin(g*Math.PI*2)*(1-g);}
  return[h,w];
}

function drawTree(x,y,z0,size,h,w,swx,swy,amp){
  const tr=shades('#7a4a26',3,0.75,1.05);
  const nt=Math.max(1,Math.round(3*h));for(let i=0;i<nt;i++)ell(x,y,z0+i,0.05*size*w,tr[i%3]);
  const N=12,gs=shades('#3f7a33',N,0.62,1.25);
  for(let i=0;i<N;i++){const tier=Math.floor(i/4),j=i%4;const r=size*w*(0.30-tier*0.065)*(1-j*0.2);const f=Math.pow(i/N,1.6)*amp;
    ell(x+swx*f,y+swy*f,z0+nt+i*h,r,gs[i]);}
}
function drawHouse(x,y,z0,size,ang,h,w,now,lit,smoke,hs){
  const c=Math.cos(ang),s=Math.sin(ang),W=0.22*size*w,D=0.17*size*w;
  const rect=(a,b)=>[[ c*a- s*b, s*a+c*b],[ c*-a- s*b, s*-a+c*b],[ c*-a- s*-b, s*-a+c*-b],[ c*a- s*-b, s*a+c*-b]];
  const nb=Math.max(1,Math.round(6*h*size)),wall=shades('#efe0c0',nb,0.78,1.02);
  for(let i=0;i<nb;i++)poly(x,y,z0+i,rect(W,D),wall[i]);
  // windows on the face most toward the camera
  const faces=[[1,0,W],[-1,0,W],[0,1,D],[0,-1,D]];let best=null,bd=-9;
  for(const[fx,fy,e]of faces){const wx=c*fx-s*fy,wy=s*fx+c*fy;const dd=wx*V.sn+wy*V.cs;if(dd>bd){bd=dd;best=[wx*e*1.02,wy*e*1.02];}}
  proj(x+best[0],y+best[1],z0+nb*0.55);const ws=Math.max(1.5,V.S*0.055*w);
  V.ctx.fillStyle=lit?`rgba(255,${200+((Math.sin(now/700+hs*9)*20)|0)},90,${0.85+0.15*Math.sin(now/300+hs*5)})`:'#6b5a48';
  V.ctx.fillRect(PX-ws*1.6,PY-ws,ws,ws);V.ctx.fillRect(PX+ws*0.6,PY-ws,ws,ws);
  const nr=Math.max(1,Math.round(5*h*size)),roof=shades('#b8452e',nr,0.8,1.12);
  for(let i=0;i<nr;i++){const k=1-i/nr;poly(x,y,z0+nb+i,rect((W+0.04)*k+0.01,D+0.04),roof[i]);}
  // chimney
  const chx=x+c*W*0.5-s*D*0.4,chy=y+s*W*0.5+c*D*0.4;
  const cz=z0+nb+Math.round(nr*0.3);for(let i=0;i<Math.round(4*h);i++)ell(chx,chy,cz+i,0.035*size,i>2?'#8a5a46':'#6e4436');
  if(smoke&&h>0.9){for(let k=0;k<3;k++){const u=((now/1000)*0.32*AM+k/3+hs)%1;proj(chx+u*0.3,chy-u*0.12,cz+4+u*22);
    V.ctx.fillStyle=`rgba(244,238,228,${(1-u)*0.7})`;V.ctx.beginPath();V.ctx.arc(PX,PY,V.S*(0.035+u*0.07),0,TAU);V.ctx.fill();}}
}
function drawWheatRows(x,y,z0,lv,ang,h,w,now){
  const nr=[2,3,3,4][lv],nh=Math.max(1,Math.round([3,4,6,7][lv]*h)),cols=shades('#d9a52e',nh,0.7,1.2);
  const c=Math.cos(ang),s=Math.sin(ang);const rows=[];
  for(let j=0;j<nr;j++){const o=(j-(nr-1)/2)*0.3;const L=(0.62-Math.abs(o)*0.5)*w;rows.push([x-s*o,y+c*o,L]);}
  rows.sort((A,B)=>depthOf(A[0],A[1])-depthOf(B[0],B[1]));
  const t=now/1000;
  for(const[rx,ry,L]of rows){const sway=Math.sin(t*1.7-(rx*0.8+ry*0.5))*0.07*AM;const ww=0.055;
    for(let i=0;i<nh;i++){const f=sway*(i/nh);const ox=f*0.8,oy=f*0.6;
      poly(rx+ox,ry+oy,z0+i,[[c*L-s*ww,s*L+c*ww],[-c*L-s*ww,-s*L+c*ww],[-c*L+s*ww,-s*L-c*ww],[c*L+s*ww,s*L-c*ww]],cols[i]);}
    // ears
    const f=sway;for(let e=-2;e<=2;e++)ell(rx+c*L*e*0.42+f*0.8,ry+s*L*e*0.42+f*0.6,z0+nh,0.04,'#f6d36a');}
}

function tileObjects(k,cx,cy,type,lv,now,opts){
  opts=opts||{};const vv=opts.vv,[h,w]=opts.ghost?[1,1]:popF(vv,now);if(h<=0)return;
  const c=state.cells[k],q=c?c.q:0,r=c?c.r:0,hs=hash(q,r,7),z0=SLAB+1,t=now/1000;
  if(type===0){pushItem(cx,cy,()=>drawWheatRows(cx,cy,z0,lv,hs*Math.PI,h,w,now),-0.05);}
  else if(type===1){const n=[1,2,3,3][lv],size=[0.72,0.85,0.95,1.15][lv];const offs=[[[0,0]],[[-0.25,0.05],[0.25,-0.08]],[[-0.3,0.12],[0.28,0.15],[0,-0.28]]][n-1];
    const ca=Math.cos(hs*TAU),sa=Math.sin(hs*TAU);
    offs.forEach(([ox,oy],i)=>{const x=cx+ca*ox-sa*oy,y=cy+sa*ox+ca*oy;const ph=hash(q,r,i);
      const rust=Math.max(0,Math.sin(t*0.4+ph*20)-0.92)*12;const amp=(0.05+rust*0.04)*AM;
      const sw=Math.sin(t*1.3+ph*6+x*0.4)*amp+Math.sin(t*7+ph)*rust*0.01*AM;
      pushItem(x,y,()=>drawTree(x,y,z0,size*(1-i*0.08),h,w,sw,sw*0.5,1));});}
  else if(type===2){ // fence posts on cluster boundary
    for(let e=0;e<6;e++){const d=DIRS[5-e];const nk=key(q+d[0],r+d[1]);const nc=state.cells[nk];
      if(!opts.ghost&&nc&&nc.tile===2)continue; if(opts.ghost&&e%2)continue;
      const a=(30+60*e)*Math.PI/180,px=cx+Math.cos(a)*0.82,py=cy+Math.sin(a)*0.82;
      pushItem(px,py,()=>{for(let i=0;i<Math.round(5*h);i++)ell(px,py,z0+i,0.03,i>3?'#c49a6c':'#8a5d36');});}
    if(opts.ghost)pushItem(cx,cy,()=>drawSheep(cx,cy,z0,0.6,false,0,1));}
  else if(type===3){ if(lv>=1){const lx=cx+Math.cos(hs*9)*0.3,ly=cy+Math.sin(hs*9)*0.25;pushItem(lx,ly,()=>{ell(lx,ly,SLAB+0.2,0.1,'#5d9a45');ell(lx+0.03,ly,SLAB+0.3,0.03,'#f4a7c0');},-0.3);}
    if(!opts.ghost){const per=(RM?11:5.5)-lv*0.8+hs*3,u=((t+hs*13)%per)/1.1;
      if(u<1){const a=hs*TAU,fx=cx+Math.cos(a)*(u-0.5)*0.5,fy=cy+Math.sin(a)*(u-0.5)*0.5,fz=SLAB+Math.sin(u*Math.PI)*16;pushItem(fx,fy,()=>drawFish(fx,fy,fz,a),0.2);}}}
  else if(type===4){const n=lv>=2?2:1,size=[0.78,0.95,0.85,1.05][lv];const offs=n===1?[[0,0]]:[[-0.24,0.1],[0.26,-0.14]];
    const ca=Math.cos(hs*TAU),sa=Math.sin(hs*TAU);
    offs.forEach(([ox,oy],i)=>{const x=cx+ca*ox-sa*oy,y=cy+sa*ox+ca*oy;const s2=size*(1-i*0.15);
      pushItem(x,y,()=>drawHouse(x,y,z0,s2,hs*Math.PI+i*0.6,h,w,now,season()>=2||lv>=1,lv>=1||opts.ghost,hash(q,r,i)));});}
}

// ---------- agents (sheep + villagers) ----------
function tileKeyAt(x,y){const rr=y/1.5,qq=x/SQ3-rr/2;let rx=Math.round(qq),rz=Math.round(rr),ry=Math.round(-qq-rr);
  const dx=Math.abs(rx-qq),dz=Math.abs(rz-rr),dy=Math.abs(ry+qq+rr);if(dx>dy&&dx>dz)rx=-ry-rz;else if(dy<=dz)rz=-rx-ry;return[rx,rz];}
function rebuildAgents(now){
  const want=[];const houses=[];
  for(const k in state.cells){const c=state.cells[k];if(c.tile===2){const lv=levelOf(sizes[k]||1);want.push({k,kind:'sheep',n:[1,1,2,2][lv]});}if(c.tile===4)houses.push(k);}
  const total=Math.min(16,Math.floor(state.tracks[4]/3));
  houses.forEach((k,i)=>{const n=Math.floor(total/houses.length)+(i<total%houses.length?1:0);if(n)want.push({k,kind:'vill',n});});
  const next=[];
  for(const wnt of want){const have=agents.filter(a=>a.home===wnt.k&&a.kind===wnt.kind).slice(0,wnt.n);next.push(...have);
    const c=state.cells[wnt.k],[x,y]=wpos(c.q,c.r);
    for(let i=have.length;i<wnt.n;i++){const a=Math.random()*TAU;const ax=x+Math.cos(a)*0.25,ay=y+Math.sin(a)*0.25;
      next.push({kind:wnt.kind,home:wnt.k,type:wnt.kind==='sheep'?2:4,x:ax,y:ay,tx:ax,ty:ay,wait:Math.random()*2,face:a,born:now+350+i*120,hopT:-1e9,
        col:['#4f78b8','#c24f4f','#e0a030','#6f9e45','#8a5fb0'][Math.floor(Math.random()*5)]});}}
  agents=next;
}
function updateAgents(dt,now){
  for(const a of agents){if(a.born>now)continue;
    if(a.wait>0){a.wait-=dt;if(a.kind==='sheep'&&!RM&&Math.random()<dt*0.12)a.hopT=now;continue;}
    const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy),sp=(a.kind==='sheep'?0.16:0.3)*(RM?0.5:1);
    if(d<0.02){a.wait=a.kind==='sheep'?1.5+Math.random()*3.5:0.6+Math.random()*2;
      const[cq,cr]=tileKeyAt(a.x,a.y);const ck=key(cq,cr);const cur=state.cells[ck]&&state.cells[ck].tile===a.type?state.cells[ck]:state.cells[a.home];
      const cand=[cur];for(const[q1,r1]of DIRS){const nc=state.cells[key(cur.q+q1,cur.r+r1)];if(nc&&nc.tile===a.type)cand.push(nc);}
      const pick=cand[Math.floor(Math.random()*cand.length)];const[px,py]=wpos(pick.q,pick.r);const an=Math.random()*TAU,rd=Math.random()*0.33;
      a.tx=px+Math.cos(an)*rd;a.ty=py+Math.sin(an)*rd;continue;}
    const st=Math.min(d,sp*dt);a.x+=dx/d*st;a.y+=dy/d*st;a.face=Math.atan2(dy,dx);}
}

let waveMarks=[],foamEdges=[];
function buildScenery(){
  const rand=rng(state.seed+5);waveMarks=[];
  for(let i=0;i<70;i++){const a=rand()*TAU,d=4+rand()*4.6;const x=Math.cos(a)*d,y=Math.sin(a)*d;const[q,r]=tileKeyAt(x,y);const c=state.cells[key(q,r)];
    if(c&&c.t!=='sea')continue;waveMarks.push([x,y,rand()*TAU]);}
  foamEdges=[];
  for(const k in state.cells){const c=state.cells[k];if(c.t==='sea')continue;const[x,y]=wpos(c.q,c.r);
    for(let e=0;e<6;e++){const d=DIRS[5-e];const nc=state.cells[key(c.q+d[0],c.r+d[1])];if(nc&&nc.t!=='sea')continue;
      const a0=(30+60*e)*Math.PI/180,a1=(90+60*e)*Math.PI/180,am=(60+60*e)*Math.PI/180;
      foamEdges.push([x+Math.cos(a0),y+Math.sin(a0),x+Math.cos(a1),y+Math.sin(a1),Math.cos(am),Math.sin(am),hash(c.q,c.r,e)*TAU]);}}
}

let last=performance.now();
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);CW=Math.max(1,r.width);CH=Math.max(1,r.height);
  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);}

const RB=9.2;
function boardPath(z,k){const c=V.ctx;proj(0,0,z);const bx=PX,by=PY;c.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3,wx=Math.cos(a)*k,wy=Math.sin(a)*k;const X=bx+(wx*V.cs-wy*V.sn)*V.S,Y=by+(wx*V.sn+wy*V.cs)*V.S*PITCH;i?c.lineTo(X,Y):c.moveTo(X,Y);}c.closePath();}
function frame(now){
  const t0=performance.now();const dt=Math.min(0.05,(now-last)/1000);last=now;

    d.innerHTML=`<canvas></canvas><div class="lb"><span class="dot" style="background:${T[p[0]].c}"></span>${T[p[0]].n} + <span class="dot" style="background:${T[p[1]].c}"></span>${T[p[1]].n}</div>`;
    d.addEventListener('pointerdown',e=>cardDown(e,i,d));h.appendChild(d);});
  const rb=document.createElement('button');rb.className='btn';rb.id='rotBtn';rb.textContent='↻';rb.title='조각 회전 (R)';rb.onclick=()=>rotatePiece(1);h.appendChild(rb);
  miniKey='';
}
function renderAll(){renderTop();renderTracks();renderSide();}

// ---------- animation timeline ----------
function schedule(at,fn){anims.push({at,fn});anims.sort((a,b)=>a.at-b.at);}
function runAnims(now){while(anims.length&&anims[0].at<=now)anims.shift().fn(false);}
function flushAnims(){while(anims.length)anims.shift().fn(true);$('banners').innerHTML='';$('feed').classList.remove('show');}
function banner(text,depth,col){const b=document.createElement('div');b.className='banner';b.style.fontSize=(16+depth*4)+'px';b.style.borderColor=col||'';
  b.innerHTML=(depth?`<span class="dp">연쇄 ${depth}</span>`:'')+text;$('banners').appendChild(b);setTimeout(()=>b.remove(),2700);
  const bs=$('banners').children;while(bs.length>4)bs[0].remove();}
function burst(n){const r=cv.getBoundingClientRect();for(let i=0;i<(RM?n/3:n);i++)confetti.push({x:CW/2+(Math.random()-0.5)*80,y:CH*0.3,vx:(Math.random()-0.5)*420,vy:-180-Math.random()*320,
  rot:Math.random()*6,vr:(Math.random()-0.5)*12,col:['#ffd56a','#e3b23c','#c8643f','#5fb0dc','#9fcb5e','#ffffff'][i%6],life:1.4+Math.random()*0.8});}
function showFeed(f,flushed){disp=disp.slice();disp[0]=f.grainAfter;renderTracks();renderTop();if(flushed)return;
  const el=$('feed');el.className='panel show';
  el.innerHTML=`<h3>${SEASONS[f.season]} 끝 · 먹이기</h3><div class="ln">주민 <b>${f.people}</b>명 → 곡식 <b>${f.need}</b> 필요</div><div class="ln">곡식 ${f.had} 있음 → ${f.grainAfter} 남음</div>`+
    (f.shortfall?`<div class="pen">곡식 ${f.shortfall} 부족! −${f.penalty}점</div>`:`<div class="ok">모두 배불러요!</div>`);
  pulseTrack(0);setTimeout(()=>el.classList.remove('show'),2600);}
function placeReal(sim){
  flushAnims();
  const before=JSON.stringify(sim);
  const passes=commit(state,sim);
  const now=performance.now();
  // visuals
  sim.halves.forEach((h,i)=>{vis[h.key]={born:now+i*110,grownAt:0};});
  const ns=computeSizes(state);
  for(const k in ns){if(sim.halves.some(h=>h.key===k))continue;if(levelOf(ns[k])!==levelOf(sizes[k]||1)&&vis[k])vis[k].grownAt=now+320;else if(ns[k]!==sizes[k]&&vis[k])vis[k].grownAt=now+320;}
  sizes=ns;rebuildAgents(now);
  preview=null;touchArmed=null;lastResult=sim;
  if(sel>=state.hand.length)sel=Math.max(0,state.hand.length-1);
  renderHand();renderSide();renderTop();
  let tt=now+300;
  sim.steps.forEach(s=>{schedule(tt,fl=>{disp[s.track]=s.after;renderTracks();renderTop();pulseTrack(s.track);if(fl)return;
      let fx,fy;if(s.kind==='action'){const h=sim.halves[s.half];[fx,fy]=wpos(h.q,h.r);}else{[fx,fy]=wpos((sim.q+sim.q2)/2,(sim.r+sim.r2)/2);}
      floaters.push({x:fx,y:fy,z:SLAB+14+(s.kind==='bonus'?s.depth*6:0),text:`+${s.amount} ${T[s.track].res}`,col:T[s.track].c,size:Math.max(15,V.S*(s.kind==='bonus'?0.42+s.depth*0.06:0.4)),t0:performance.now()});
      if(s.kind==='bonus'){banner(`${T[s.from].res} ${s.threshold}! <b>${s.name}</b> → ${T[s.track].res} +${s.amount}`,s.depth,T[s.track].c);if(s.depth>=3)burst(30+s.depth*10);}});
    tt+=s.kind==='action'?380:650;});
  if(sim.depth>=2)schedule(tt-200,fl=>{if(!fl)banner(`연쇄 ${sim.depth}단!`,sim.depth+1,'#b5501f');});
  if(sim.seasonEnd){const f=sim.seasonEnd;schedule(tt+250,fl=>showFeed(f,fl));tt+=2700;}
  for(const p of passes){schedule(tt,fl=>{if(!fl)banner('놓을 곳이 없어 한 차례 건너뜀',0);});tt+=600;if(p.feed){const f=p.feed;schedule(tt,fl=>showFeed(f,fl));tt+=2700;}}
  schedule(tt,()=>{disp=state.tracks.slice();renderTracks();renderTop();if(state.over)showResult();});
  console.assert(JSON.stringify(sim)===before,'sim mutated');
  return sim;
}
function showResult(){
  gameOverShown=true;const sum=state.tracks.reduce((a,b)=>a+b,0),low=Math.min(...state.tracks),score=scoreOf(state.tracks,state.penalty,state.balanced);
  $('resultBox').innerHTML=`<h2>섬 완성!</h2><div style="font-size:14px">${state.balanced?'균형 섬: 가장 낮은 트랙 × 5':'합산 점수'}</div><div class="big">${score}점</div>
   <table>${RING.map(i=>`<tr><td><span class="dot" style="background:${T[i].c}"></span> ${T[i].res}</td><td>${state.tracks[i]}</td></tr>`).join('')}
   <tr><td>${state.balanced?'가장 낮은 트랙 × 5':'트랙 합계'}</td><td>${state.balanced?low*5:sum}</td></tr>
   <tr><td style="color:#c2412d">먹이기 벌점</td><td style="color:#c2412d">−${state.penalty}</td></tr>
   <tr><td>최대 연쇄 / 보너스 수</td><td>${state.maxDepth}단 / ${state.bonusTotal}회</td></tr></table>
   <div class="btns"><button class="btn" id="rAgain">다시 (같은 섬)</button><button class="btn" id="rNew">새 섬</button></div>`;
  $('overlay').classList.add('show');$('rAgain').onclick=()=>startGame(state.seed);$('rNew').onclick=()=>startGame(randSeed());}
function randSeed(){return 1+Math.floor(Math.random()*9998);}
function startGame(seed){flushAnims();state=newState(seed,state.balanced);disp=state.tracks.slice();sizes={};vis={};agents=[];preview=null;lastResult=null;sel=0;rot=0;floaters=[];confetti=[];
  $('overlay').classList.remove('show');gameOverShown=false;buildScenery();renderHand();renderAll();}

// ---------- preview ----------
function setPreview(q,r){
  if(state.over||!state.hand[sel]){preview=null;renderTracks();renderSide();return;}
  const p=preview;if(p&&p.q===q&&p.r===r&&p.rot===rot&&p.h===sel&&p.placed===state.placed)return;
  const sim=simulate(state,sel,q,r,rot);preview={q,r,rot,h:sel,placed:state.placed,sim};window.__isle.lastPreview=sim;renderTracks();renderSide();}
function clearPreview(){if(!preview)return;preview=null;renderTracks();renderSide();}
function refreshPreview(){if(hoverHex)setPreview(hoverHex[0],hoverHex[1]);}
function rotatePiece(d){rot=(rot+d+6)%6;miniKey='';if(preview){const{q,r}=preview;preview=null;setPreview(q,r);}}
function pick(clientX,clientY){const b=cv.getBoundingClientRect();const sx=clientX-b.left,sy=clientY-b.top+SLAB*V.sh;
  const rx=(sx-V.cx)/V.S,ry=(sy-V.cy)/(V.S*PITCH);const x=rx*V.cs+ry*V.sn,y=-rx*V.sn+ry*V.cs;const[q,r]=tileKeyAt(x,y);return state.cells[key(q,r)]?[q,r]:null;}
function screenOf(q,r){setupView(V,cam.yaw);const[x,y]=wpos(q,r);proj(x,y,SLAB);const b=cv.getBoundingClientRect();return{x:b.left+PX,y:b.top+PY};}

// ---------- input ----------
let rdrag=null,ldrag=null,twoF=null,cardDrag=null;const touches=new Map();
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'){touches.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY});
    if(touches.size===2){const[a,b]=[...touches.values()];twoF={ang:Math.atan2(b.y-a.y,b.x-a.x),yaw:cam.yaw};}return;}
  if(e.button===2){rdrag={x0:e.clientX,yaw0:cam.yaw,moved:false};cv.setPointerCapture(e.pointerId);}
  else if(e.button===0){ldrag={x0:e.clientX,y0:e.clientY,yaw0:cam.yaw,moved:false};cv.setPointerCapture(e.pointerId);}});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'){const t=touches.get(e.pointerId);if(!t)return;t.x=e.clientX;t.y=e.clientY;
    if(twoF&&touches.size>=2){const[a,b]=[...touches.values()];const ang=Math.atan2(b.y-a.y,b.x-a.x);cam.yaw=cam.target=twoF.yaw+(ang-twoF.ang);miniKey='';}return;}
  if(rdrag){const dx=e.clientX-rdrag.x0;if(Math.abs(dx)>5)rdrag.moved=true;if(rdrag.moved){cam.yaw=cam.target=rdrag.yaw0+dx*0.01;}return;}
  if(ldrag){const dx=e.clientX-ldrag.x0;if(Math.abs(dx)>10||Math.abs(e.clientY-ldrag.y0)>10)ldrag.moved=true;if(ldrag.moved){cam.yaw=cam.target=ldrag.yaw0+dx*0.01;return;}}
  if(cardDrag)return;
  const h=pick(e.clientX,e.clientY);hoverHex=h;if(h)setPreview(h[0],h[1]);else clearPreview();});
cv.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch'&&!cardDrag&&!rdrag&&!ldrag){hoverHex=null;clearPreview();}});
cv.addEventListener('pointerup',e=>{
  if(e.pointerType==='touch'){const t=touches.get(e.pointerId);touches.delete(e.pointerId);if(twoF){if(touches.size<2)twoF=null;return;}
    if(t&&Math.hypot(t.x-t.x0,t.y-t.y0)<12){const h=pick(e.clientX,e.clientY);if(!h)return;
      if(touchArmed&&touchArmed[0]===h[0]&&touchArmed[1]===h[1]&&preview&&preview.sim.valid&&preview.q===h[0]&&preview.r===h[1]){placeReal(preview.sim);return;}
      hoverHex=h;setPreview(h[0],h[1]);touchArmed=h;}return;}
  if(rdrag){const m=rdrag.moved;rdrag=null;cam.target=cam.yaw;if(!m)rotatePiece(1);return;}
  if(ldrag){const m=ldrag.moved;ldrag=null;cam.target=cam.yaw;if(m)return;
    const h=pick(e.clientX,e.clientY);if(!h)return;setPreview(h[0],h[1]);if(preview&&preview.sim.valid)placeReal(preview.sim);}});
cv.addEventListener('pointercancel',e=>{touches.delete(e.pointerId);twoF=null;rdrag=null;ldrag=null;});
let wheelT=0;cv.addEventListener('wheel',e=>{e.preventDefault();const n=performance.now();if(n-wheelT<90)return;wheelT=n;rotatePiece(e.deltaY>0?1:-1);},{passive:false});
function cardDown(e,i,el){e.preventDefault();sel=i;miniKey='';document.querySelectorAll('.card').forEach((c,j)=>c.classList.toggle('sel',j===i));
  if(preview){const{q,r}=preview;preview=null;setPreview(q,r);}
  cardDrag={i,x0:e.clientX,y0:e.clientY,moved:false,el};el.setPointerCapture(e.pointerId);
  el.onpointermove=ev=>{if(!cardDrag)return;if(Math.hypot(ev.clientX-cardDrag.x0,ev.clientY-cardDrag.y0)>8){cardDrag.moved=true;el.classList.add('drag');}
    if(!cardDrag.moved)return;const h=pick(ev.clientX,ev.clientY);const b=cv.getBoundingClientRect();
    const inside=ev.clientX>=b.left&&ev.clientX<=b.right&&ev.clientY>=b.top&&ev.clientY<=b.bottom;
    if(h&&inside){hoverHex=h;setPreview(h[0],h[1]);}else{hoverHex=null;clearPreview();}};
  el.onpointerup=ev=>{const d=cardDrag;cardDrag=null;el.classList.remove('drag');el.onpointermove=null;el.onpointerup=null;
    if(d&&d.moved&&preview&&preview.sim.valid)placeReal(preview.sim);else if(d&&d.moved)clearPreview();};
  el.onpointercancel=()=>{cardDrag=null;el.classList.remove('drag');};}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='r')rotatePiece(e.shiftKey?-1:1);else if(k==='q'){cam.target-=Math.PI/3;miniKey='';}else if(k==='e'){cam.target+=Math.PI/3;miniKey='';}
  else if(['1','2','3'].includes(k)&&state.hand[+k-1]){sel=+k-1;renderHand();refreshPreview();}else if(k==='escape')clearPreview();});
$('camL').onclick=()=>{cam.target-=Math.PI/3;};$('camR').onclick=()=>{cam.target+=Math.PI/3;};
$('againBtn').onclick=()=>startGame(state.seed);$('newBtn').onclick=()=>startGame(randSeed());
$('balBtn').onclick=()=>{state.balanced=!state.balanced;preview=null;renderAll();};

// ---------- test hooks ----------
window.__isle={
  get state(){return state;},
  simulate:(h,q,r,ro)=>simulate(state,h,q,r,ro),
  simulateOn:(st,h,q,r,ro)=>simulate(st,h,q,r,ro),
  placeAt(h,q,r,ro){const s=simulate(state,h,q,r,ro);if(!s.valid)return s;return placeReal(s);},
  setHand(list){state.hand=list.map(p=>[p[0],p[1]]);sel=0;renderHand();renderAll();},
  setBoard(list,tracks){for(const[q,r,ty]of list){const c=state.cells[key(q,r)];if(c&&c.t==='land')c.tile=ty;}
    if(tracks){state.tracks=tracks.slice();disp=tracks.slice();}sizes=computeSizes(state);for(const k in state.cells)if(state.cells[k].tile!==null&&!vis[k])vis[k]={born:0,grownAt:0};
    rebuildAgents(performance.now());renderAll();},
  setTracks(t){state.tracks=t.slice();disp=t.slice();renderAll();},
  validMoves:()=>validMoves(state),
  newGame:(seed)=>startGame(seed),
  newState,commit,validMoves,
  hover(h,q,r,ro){sel=h;rot=ro;renderHand();preview=null;hoverHex=[q,r];setPreview(q,r);return preview.sim;},
  setYaw(rad,instant){cam.target=rad;if(instant)cam.yaw=rad;miniKey='';},
  screenOf,flush:flushAnims,
  get rot(){return rot;},get sel(){return sel;},get yaw(){return cam.yaw;},get preview(){return preview&&preview.sim;},
  perf(){const s=perf.samples.slice().sort((a,b)=>a-b);return{n:s.length,avg:s.reduce((a,b)=>a+b,0)/Math.max(1,s.length),p95:s[Math.floor(s.length*0.95)]||0,max:s[s.length-1]||0};},
  resetPerf(){perf.samples=[];},
  agents:()=>agents.length,
  lastPreview:null,
};
buildScenery();renderHand();renderAll();
requestAnimationFrame(t=>{last=t;frame(t);});
if(document.fonts)document.fonts.ready.then(()=>{miniKey='';});
</script>
</body>
</html>
