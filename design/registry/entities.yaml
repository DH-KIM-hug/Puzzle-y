# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: line_cell_count
    status: active
    source: design/gdd/board-rules.md
    referenced_by:
      - design/gdd/board-rules.md
      - design/gdd/chain-resolver.md
      - design/gdd/scoring.md
    variables:
      - board_width
      - board_height
      - completed_rows
      - completed_cols
    output_range: [0, 64]
    expression: "W * R + H * C - R * C"
    notes: "Cells covered by completed lines (intersections once). Input to scoring via chain-resolver events."
    added: 2026-11-07
    revised: ""
  - name: chain_depth
    status: active
    source: design/gdd/chain-resolver.md
    referenced_by:
      - design/gdd/chain-resolver.md
    variables:
      - activated_faces_per_wave
      - depth_cap
      - faces_on_board
    output_range: [0, 6]
    expression: "count of waves k with A_k > 0; <= min(depth_cap, F_board)"
    notes: "Player-facing chain N. Read by stage goals (chain N), HUD, records. Upper bound follows depth_cap."
    added: 2026-11-07
    revised: ""

  - name: depth_mult_pct
    status: active
    source: design/gdd/scoring.md
    referenced_by:
      - design/gdd/scoring.md
      - design/gdd/chain-resolver.md
    variables:
      - wave_depth
      - depth_step_pct
      - depth_mult_max_pct
    output_range: [100, 400]
    expression: "min(100 + depth_step_pct * k, depth_mult_max_pct)"
    notes: "Integer percent. Owns chain-resolver F6 (reference copy there named depth_step_bonus=0.5)."
    added: 2026-11-07
    revised: ""
  - name: placement_total
    status: active
    source: design/gdd/scoring.md
    referenced_by:
      - design/gdd/scoring.md
    variables:
      - placement_points
      - clear_points_per_wave
      - activation_points_per_wave
      - fizzle_points
    output_range: [1, 87046]
    expression: "n_placed*place_points_per_cell + sum_k(floor((N_line*line_mult_pct(L)+N_ab*100)*cell_points*depth_mult_pct(k)/10000) + activations_k*floor(activation_points_base*depth_mult_pct(k)/100)) + fizzle_points*n_fizzled"
    notes: "Per-placement score, added to stage_score at commit. Read by stage goals (score goal, star thresholds), HUD, preview. Upper bound is a conservative overflow/HUD-digit bound, not a play value."
    added: 2026-11-07
    revised: ""
  - name: expected_piece_cells
    status: active
    source: design/gdd/crew-definition.md
    referenced_by:
      - design/gdd/crew-definition.md
    variables:
      - shape_weight
      - shape_cells
    output_range: [1, 6]
    expression: "E_c = sum(w_s*|s|)/sum(w_s); team E_T = sum(share_c*E_c)"
    notes: "Per-crew balance metric; lint range 2.0-5.0. MVP values 2.00 (piyak) to 4.75 (gomgom). Tray supply provides share_c."
    added: 2026-11-07
    revised: ""
